<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>填报助手</title>
  <style>
    body { width: 340px; margin: 0; padding: 18px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; }
    h1 { font-size: 17px; margin: 0 0 8px; }
    p { margin: 8px 0; }
    .muted { color: #5f6368; font-size: 12px; }
    input[type=file] { width: 100%; margin: 12px 0; }
    button { width: 100%; padding: 9px; border: 0; border-radius: 6px; color: white; background: #1769aa; cursor: pointer; margin: 5px 0; }
    button:disabled { background: #a9b4be; cursor: default; }
    button.secondary { color: #1769aa; background: #e9f2f9; }
    button.plain { color: #5f6368; background: #f1f3f4; }
    #status { margin-top: 12px; white-space: pre-wrap; word-break: break-word; }
    #results { margin: 10px 0 0; padding-left: 20px; max-height: 260px; overflow: auto; }
    .ok { color: #137333; }
    .warn { color: #ad5700; }
    .error { color: #b3261e; }
  </style>
</head>
<body>
  <h1>月度申请填报助手</h1>
  <p>首次设定默认 JSON 文件后，每月可直接填写；临时选择会从默认文件或上次选择的位置打开。</p>
  <button id="remember" class="secondary">设为默认 JSON 文件</button>
  <button id="forget" class="plain" hidden>取消默认文件</button>
  <button id="choose" class="secondary">本次选择其他 JSON 文件</button>
  <input id="profile" type="file" accept=".json,application/json" aria-label="本次临时选择 JSON 文件" hidden>
  <button id="fill" disabled>填入当前申请页</button>
  <p class="muted">页面顶部的“申报主体”由登录账号带出；JSON 中的“姓名”填写下方基本信息表的“姓名”。</p>
  <button id="confirm" class="secondary">已核对，勾选页面承诺</button>
  <div id="status" class="muted">扩展不保存资料内容；默认文件在填写时重新读取。</div>
  <ul id="results"></ul>
  <script src="popup.js"></script>
</body>
</html>
